interface:
  display_name: "Coding TDD"
  short_description: "Red-green test-first workflow with review before final refactor"
  default_prompt: "Use $coding-tdd for this test-first task. Deliver one observable behavior at a time: write and witness RED, make the same test GREEN with the smallest implementation, then continue. After every requested slice is GREEN, use $reviewing-code on the completed diff, resolve material findings, then refactor once and rerun affected validation."
metadata:
  author: disturb-yy
  version: "1.1"
policy:
  allow_implicit_invocation: true
