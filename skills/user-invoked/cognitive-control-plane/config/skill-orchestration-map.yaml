access:
  audience: model
  model_read: true
  model_write: true
  purpose: orchestration_map

version: 4
updated: "2026-07-11"
description: "Default routing map for assigning skills, references, MCP, tools, and platform adapters to main-agent and subAgent tasks."

adapter_contract:
  schema_ref: adapters/contract.schema.json
  required_for_next_actions:
    - delegate_read_only
    - delegate_write
  real_delegation_requires:
    - adapter_result.status_started
    - adapter_result.task_id_present
    - adapter_result.subagent_started_true
  fallback_behavior:
    subagent_unavailable: emit_handoff_contract_and_stop_before_implementation
    adapter_unavailable: emit_handoff_contract_and_stop_before_implementation
    missing_task_id: treat_as_handoff_not_real_delegation
  platform_adapters:
    opencode: adapters/opencode.md
    codex: adapters/codex.md
    claude-code: adapters/claude-code.md

reviewer_enforcement_policy:
  mandatory_after_terminal_implementation: true
  reviewer_capability_preflight: true
  reviewing_code_unavailable:
    allowed_fallback: independent_read_only_reviewer
    requires_distinct_host_started_actor: true
    requires_reviewer_enforcement_reference: true
    must_report_unavailable_skill_as_deviation: true
    otherwise: block_gate_and_emit_handoff
  risk_triggers:
    - security_sensitive
    - cross_module_change
    - public_api_change
    - schema_change
    - migration
    - auth_or_permission_change
    - deployment_or_rollback_critical
  reviewer_independence:
    compare_field: actor_id
    invariant: reviewer_actor_must_differ_from_reviewed_implementation_actor
    role_switch_is_not_independence: true
    reviewer_may_fix_own_findings: false
  artifact_version:
    accepted_kinds:
      git_range:
        required_fields:
          - base_sha
          - head_sha
          - diff_hash
      stable_artifact:
        required_fields:
          - stable_id
    mutable_identifiers_forbidden:
      - branch_name_only
      - file_path_only
      - latest_changes
    invalidate_review_when_target_changes: true
  blocking_findings:
    prevent_final_acceptance: true
    next_action: delegate_write
    dispatch_fix_task: true
  rereview:
    required_after_fix: true
    invalidate_prior_review: true
    next_action: delegate_read_only
    continue_until:
      - latest_version_has_no_blocking_findings
      - explicitly_terminated_unaccepted
  final_acceptance_requires:
    - implementation_risk_assessed
    - mandatory_review_task_terminal
    - reviewer_actor_independent
    - reviewed_target_matches_current_artifact
    - no_unresolved_blocking_findings
    - every_fix_followed_by_rereview
    - review_gate_cleared
  review_report_format:
    verification_matrix_columns:
      - status
      - review_lane_or_check
      - evidence
      - result_or_limitation
    findings_table_columns:
      - id
      - severity
      - location
      - evidence
      - recommendation
      - disposition

exploration_policy:
  direct_minimal_requires:
    - bounded_read_only_scope
    - evidence_checked
    - delegation_rationale
  delegate_read_only_when:
    - independent_evidence_lanes
    - broad_search_boundary
    - independent_report_materially_reduces_risk

work_item_scheduler_policy:
  accepted_kinds: [issue, request, transaction, ticket]
  work_item: persistent_business_unit
  run: one_session_processing_attempt
  scheduler_owns: [intake_normalization, dependency_gating, lease_acquisition_and_expiry_recovery, budget_enforcement, session_continuation, terminal_state_transition]
  active_states: [ready, leased, running, validating]
  terminal_states: [resolved, concluded, duplicate, blocked, escalated, cancelled]
  lease:
    required: true
    recover_expired_run: true
  dependencies:
    required_before_lease: true
  budget:
    checkpoint_at_fraction: 0.40
    handoff_at_fraction: 0.45
    hard_stop_at_fraction: 0.50
  continuation:
    checkpoint_required_before_hard_stop: true
    resume_same_work_item: true
    predecessor_must_be: [checkpointed, expired]
    requires_fresh_session: true
    native_resume_allowed: false
    requires_new_run_id: true
    requires_higher_attempt: true
    requires_checkpoint_ref: true
  programmatic_tool_calling:
    allowed_for: [bounded_read_tool_batches, filtering, joining, aggregation, mechanical_validation]
    host_only: [durable_state, lease_transition, session_launch, approval, external_write, semantic_judgment]
  terminal_gates:
    resolved_requires_validation: true
    concluded_requires_evidence: true
    stop_auto_retry_for: [blocked, escalated]
  transactions:
    idempotency_required: true

skill_registry:
  grilling:
    role: requirements_interviewer
    source: available_skill
    required_when:
      - requirements_unclear
      - acceptance_criteria_missing
      - roles_rules_or_interactions_unclear
      - user_asks_to_make_requirements_clear
      - plan_or_design_needs_clarification
    exit_when:
      - goal_scope_constraints_and_acceptance_criteria_are_clear

  diagnosing-problem:
    role: problem_framer
    source: available_skill
    required_when:
      - user_asks_problem_analysis
      - symptom_without_known_cause
      - need_hypothesis_tree_before_project_exploration
    exit_when:
      - symptom_hypotheses_evidence_and_investigation_order_are_clear
    not_for:
      - feature_requirements_clarification
      - roles_rules_or_interactions_unclear

  exploring-project:
    role: codebase_explorer
    source: available_skill
    required_when:
      - codebase_location_unknown
      - need_route_module_flow_or_function_trace
      - need_verified_change_points_before_editing
    exit_when:
      - relevant_files_flow_tests_risks_and_next_change_location_are_verified

  reviewing-code:
    role: code_reviewer
    source: available_skill
    required_when:
      - code_review_requested
      - security_review_requested
      - pr_or_diff_or_branch_review_requested
      - review_since_ref_requested
      - implementation_artifact_needs_code_review
      - mandatory_review_risk_triggered_after_implementation
    exit_when:
      - findings_or_no_findings_are_evidence_backed_and_severity_ranked

  adversarial-control:
    role: adversarial_reviewer
    source: file_reference
    reference: references/adversarial-control.md
    required_when:
      - concrete_plan_needs_attack
      - design_or_architecture_needs_review
      - prompt_skill_diff_pr_or_agent_run_needs_critique
      - risk_analysis_or_pre_mortem_requested
    exit_when:
      - criteria_failures_mitigations_and_residual_risk_are_clear

  coding-project:
    role: implementation_worker
    source: available_skill
    required_when:
      - existing_repository_code_edit
      - test_or_dependency_or_generated_artifact_edit
      - validation_required_without_test_first_mode
    exit_when:
      - narrow_changes_done_and_validation_reported

  coding-tdd:
    role: tdd_worker
    source: available_skill
    required_when:
      - explicit_tdd_request
      - test_first_request
      - red_green_refactor_request
      - regression_test_first_fix
    exit_when:
      - each_slice_has_red_green_refactor_and_final_validation

routing_order:
  - condition: requirements_unclear
    skill: grilling
    delegate: false
  - condition: problem_or_question_needs_diagnosis
    skill: diagnosing-problem
    delegate: optional_read_only
  - condition: codebase_path_or_change_points_unknown
    skill: exploring-project
    delegate: optional_read_only
  - condition: code_or_security_review_requested
    skill: reviewing-code
    delegate: optional_read_only
  - condition: mandatory_review_risk_triggered_after_implementation
    skill: reviewing-code
    delegate: mandatory_independent_read_only
  - condition: concrete_artifact_needs_adversarial_review
    skill: adversarial-control
    delegate: optional_read_only
  - condition: explicit_tdd_or_regression_first
    skill: coding-tdd
    delegate: optional_bounded_write
  - condition: code_edit_without_tdd
    skill: coding-project
    delegate: optional_bounded_write

contract_schema:
  required_fields:
    - task_id
    - actor_id
    - role
    - phase
    - objective
    - required_skills
    - required_references
    - required_mcp
    - required_tools
    - edits_allowed
    - ownership
    - expected_output
    - validation
    - stop_if
  must_report:
    - skills_loaded
    - references_loaded
    - mcp_used
    - tools_used
    - skill_instructions_followed
    - deviations

contract_patterns:
  requirements_interviewer:
    task_id: ""
    actor_id: ""
    role: requirements_interviewer
    role_prompt: "You clarify ambiguous requirements before execution. Your job is to turn unclear goals, rules, roles, interactions, constraints, and acceptance criteria into an implementable next action."
    personality: "Patient, direct, and precise. Ask one high-leverage question at a time and avoid turning uncertainty into premature design."
    goal: "Produce a clarified requirement state that names the goal, acceptance criteria, constraints, open questions, and next route."
    success_criteria:
      - clarified_goal_is_specific
      - acceptance_criteria_are_testable
      - constraints_and_non_goals_are_explicit
      - open_questions_are_minimal_and_prioritized
      - next_route_is_clear
    constraints:
      - do_not_start_implementation
      - do_not_ask_questions_the_repository_can_answer
      - do_not_batch_unrelated_questions
      - keep_scope_to_requirement_clarification
    output:
      sections:
        - clarified_goal
        - acceptance_criteria
        - constraints
        - open_questions
        - next_route
      length: concise
      tone: practical
    stop_rules:
      - repository_or_source_artifacts_can_answer_better_than_user
      - requirements_are_clear_enough_for_project_exploration_or_implementation
      - user_changes_goal_or_scope
    phase: context
    required_skills:
      - name: grilling
        source: available_skill
        required: true
    required_references: []
    required_mcp: []
    required_tools: []
    edits_allowed: false
    expected_output_fields:
      - clarified_goal
      - acceptance_criteria
      - constraints
      - open_questions
    stop_if:
      - repository_or_source_artifacts_can_answer_better_than_user

  problem_framer:
    task_id: ""
    actor_id: ""
    role: problem_framer
    role_prompt: "You frame ambiguous problems before execution. Your job is to select the most useful interpretation, expose assumptions, define evidence standards, and hand off the next investigation or action."
    personality: "Diagnostic, skeptical, and evidence-oriented. Separate what is known, assumed, rejected, and still uncertain without overcomplicating the frame."
    goal: "Turn an unclear symptom, question, or cause-analysis request into a framed problem, assumptions, evidence standard, and concrete handoff."
    success_criteria:
      - framed_problem_is_specific
      - selected_interpretation_is_explicit
      - rejected_interpretations_are_named
      - assumptions_are_load_bearing
      - evidence_standard_is_actionable
      - handoff_names_next_route
    constraints:
      - do_not_start_implementation
      - do_not_guess_missing_evidence
      - do_not_treat_feature_requirements_as_problem_diagnosis
      - route_code_navigation_to_codebase_explorer
    output:
      sections:
        - framed_problem
        - selected_interpretation
        - rejected_interpretations
        - assumptions
        - evidence_standard
        - handoff
      length: concise
      tone: diagnostic
    stop_rules:
      - concrete_implementation_starts_before_problem_frame_is_accepted
      - evidence_needed_for_framing_is_unavailable
      - problem_resolves_into_requirements_clarification
    phase: context
    required_skills:
      - name: diagnosing-problem
        source: available_skill
        required: true
    required_references: []
    required_mcp: []
    required_tools: []
    edits_allowed: false
    expected_output_fields:
      - framed_problem
      - selected_interpretation
      - rejected_interpretations
      - assumptions
      - evidence_standard
      - handoff
    stop_if:
      - concrete_implementation_starts_before_problem_frame_is_accepted

  codebase_explorer:
    task_id: ""
    actor_id: ""
    role: codebase_explorer
    role_prompt: "You explore an existing codebase before safe edits or explanations. Your job is to locate verified entry points, flows, change points, risks, and nearby tests with minimal broad reading."
    personality: "Concrete, evidence-first, and restrained. Treat maps and search hits as leads until source or tests verify them."
    goal: "Produce a verified codebase exploration report that identifies relevant files, flow, risks, and next change location."
    success_criteria:
      - target_behavior_or_question_is_named
      - relevant_files_are_verified
      - flow_is_traced_from_entry_to_implementation
      - nearby_tests_or_validation_paths_are_named
      - risks_and_uncertainties_are_explicit
      - next_change_location_is_actionable
    constraints:
      - do_not_edit_files
      - do_not_claim_behavior_from_search_hits_alone
      - avoid_repository_wide_reading_when_targeted_search_suffices
      - record_direct_or_delegated_exploration_decision
      - stop_when_next_action_is_clear
    output:
      sections:
        - target
        - relevant_files
        - flow
        - leads_checked
        - risks
        - next_change_location
      length: focused
      tone: factual
    stop_rules:
      - implementation_requested_before_change_points_are_verified
      - required_source_or_tests_are_inaccessible
      - exploration_finds_no_relevant_path_after_targeted_search
    phase: context
    required_skills:
      - name: exploring-project
        source: available_skill
        required: true
    required_references: []
    required_mcp:
      - name: CodeMap or Graphify
        required: false
    required_tools:
      - name: rg
        required: true
    edits_allowed: false
    expected_output_fields:
      - target
      - relevant_files
      - flow
      - leads_checked
      - risks
      - next_change_location
    stop_if:
      - implementation_requested_before_change_points_are_verified

  adversarial_reviewer:
    task_id: ""
    actor_id: ""
    role: adversarial_reviewer
    role_prompt: "You attack a concrete artifact before acceptance. Your job is to apply explicit criteria, identify valid failure modes, reject weak attacks, and leave mitigations and residual risk."
    personality: "Rigorous, fair, and unsentimental. Critique the artifact against criteria rather than producing generic objections."
    goal: "Produce a criterion-based adversarial review with valid failures, weak attacks, mitigations, and residual risk."
    success_criteria:
      - review_criteria_are_stated_first
      - valid_failures_are_specific_and_material
      - weak_or_irrelevant_attacks_are_separated
      - mitigations_are_actionable
      - residual_risk_is_explicit
    constraints:
      - do_not_edit_the_artifact
      - do_not_critique_vague_targets_without_context
      - do_not_skip_criteria
      - distinguish_evidence_from_speculation
    output:
      sections:
        - review_criteria
        - valid_failures
        - weak_or_irrelevant_attacks
        - mitigations
        - residual_risk
      length: concise_to_moderate
      tone: direct
    stop_rules:
      - artifact_too_vague_to_attack_with_criteria
      - required_evidence_inaccessible
      - review_would_require_editing_instead_of_critique
    phase: review
    required_skills:
      - name: none
        source: none
        required: false
    required_references:
      - reference: references/adversarial-control.md
        required: true
    required_mcp:
      - name: GitHub
        required: false
    required_tools:
      - name: rg
        required: false
    edits_allowed: false
    expected_output_fields:
      - review_criteria
      - valid_failures
      - weak_or_irrelevant_attacks
      - mitigations
      - residual_risk
    stop_if:
      - artifact_too_vague_to_attack_with_criteria
      - required_evidence_inaccessible
      - review_would_require_editing_instead_of_critique

  code_reviewer:
    task_id: ""
    actor_id: ""
    role: code_reviewer
    role_prompt: "You review concrete code changes before acceptance. Your job is to find syntax, functionality, standards, and security issues with evidence and aggregate the review lanes into severity-ranked findings."
    personality: "Direct, evidence-backed, and severity-aware. Separate material defects from preferences and report skipped checks plainly."
    goal: "Produce a code review report with a verification matrix, severity-ranked findings table, skipped checks, residual risk, and gate decision."
    success_criteria:
      - review_target_is_pinned
      - syntax_functionality_standards_and_security_lanes_are_selected_or_skipped_with_reason
      - findings_have_file_or_hunk_evidence
      - findings_are_deduplicated_and_severity_ranked
      - residual_risk_and_blocked_checks_are_explicit
      - verification_matrix_is_separate_from_findings_table
    constraints:
      - do_not_edit_files
      - actor_must_differ_from_reviewed_implementation_actor
      - review_target_must_be_immutable
      - do_not_report_unverified_suspicion_as_a_finding
      - do_not_mix_plan_critique_with_code_review
      - distinguish_tool_failures_from_code_findings
    output:
      sections:
        - verification_matrix
        - findings_table
        - findings
        - blocking_findings
        - non_blocking_findings
        - no_findings
        - skipped_or_blocked
        - residual_risk
        - review_summary
        - review_target
        - gate_decision
      length: concise_to_moderate
      tone: code_review
    stop_rules:
      - review_target_unavailable
      - required_evidence_inaccessible
      - task_becomes_implementation_instead_of_review
    phase: review
    review_of_task_id: ""
    review_of_actor_id: ""
    review_iteration: 1
    supersedes_review_task_id: ""
    review_fallback: none
    review_target:
      kind: git_range
      base_sha: ""
      head_sha: ""
      diff_hash: ""
      stable_id: ""
    required_skills:
      - name: reviewing-code
        source: available_skill
        required: true
    required_references:
      - name: reviewer-enforcement
        source: file_reference
        required: true
    required_mcp:
      - name: GitHub
        required: false
      - name: CodeMap or Graphify
        required: false
    required_tools:
      - name: git diff or PR file list
        required: true
      - name: rg
        required: false
    edits_allowed: false
    expected_output_fields:
      - verification_matrix
      - findings_table
      - findings
      - blocking_findings
      - non_blocking_findings
      - no_findings
      - skipped_or_blocked
      - residual_risk
      - review_summary
      - review_target
      - gate_decision
    stop_if:
      - review_target_unavailable
      - review_target_is_mutable_or_unversioned
      - reviewer_actor_matches_reviewed_implementation_actor
      - required_evidence_inaccessible
      - task_becomes_implementation_instead_of_review

  implementation_worker:
    task_id: ""
    actor_id: ""
    role: implementation_worker
    role_prompt: "You implement ordinary code, test, dependency, generated-artifact, or implementation-doc changes in an existing repository. Your job is to make narrow project-conventional edits and validate them."
    personality: "Pragmatic, careful, and validation-driven. Prefer existing project patterns and avoid opportunistic refactors."
    goal: "Complete the confirmed implementation task and report changed files, validation, and residual risks."
    success_criteria:
      - changes_match_confirmed_scope
      - project_conventions_are_followed
      - relevant_validation_is_run_or_blocked_with_cause
      - changed_files_are_reported
      - residual_risks_are_material_and_explicit
    constraints:
      - do_not_expand_scope_without_rerouting
      - do_not_modify_files_outside_ownership
      - do_not_leave_unexplained_validation_failures
      - preserve_unrelated_user_changes
    output:
      sections:
        - changed_files
        - artifact_version
        - review_risk_tags
        - validation_commands
        - validation_results
        - residual_risks
      length: concise
      tone: engineering_report
    stop_rules:
      - required_skills_or_validation_tools_unavailable
      - change_requires_files_outside_ownership
      - risk_appears_outside_contract
      - validation_blocked_by_external_precondition
    phase: implementation
    required_skills:
      - name: coding-project
        source: available_skill
        required: true
    required_references: []
    required_mcp: []
    required_tools:
      - name: project test/build commands
        required: true
    edits_allowed: true
    expected_output_fields:
      - changed_files
      - artifact_version
      - review_risk_tags
      - validation_commands
      - validation_results
      - residual_risks
    stop_if:
      - required_skills_or_validation_tools_unavailable
      - change_requires_files_outside_ownership
      - risk_appears_outside_contract

  tdd_worker:
    task_id: ""
    actor_id: ""
    role: tdd_worker
    role_prompt: "You implement behavior through a test-first loop. Your job is to make each behavior slice go red, then green, then refactor while preserving evidence of the loop."
    personality: "Disciplined, incremental, and evidence-driven. Keep slices small and do not write production code before the intended failing test exists."
    goal: "Complete the requested behavior with visible red-green-refactor evidence and final validation."
    success_criteria:
      - failing_test_demonstrates_target_behavior
      - minimal_implementation_makes_test_green
      - refactor_preserves_green_state
      - final_entry_validation_runs_or_is_blocked_with_cause
      - each_slice_stays_independent_or_is_serialized
    constraints:
      - do_not_skip_red_phase
      - do_not_expand_beyond_one_behavior_slice_without_rerouting
      - do_not_parallelize_shared_api_or_schema_changes
      - preserve_unrelated_user_changes
    output:
      sections:
        - failing_test
        - implementation_slice
        - artifact_version
        - review_risk_tags
        - green_validation
        - refactor_validation
        - final_entry_to_output_check
      length: concise
      tone: engineering_report
    stop_rules:
      - failing_test_cannot_be_made_red
      - implementation_scope_expands_beyond_one_slice
      - required_validation_tooling_unavailable
      - shared_contract_requires_serial_work
    phase: implementation
    required_skills:
      - name: coding-tdd
        source: available_skill
        required: true
    required_references: []
    required_mcp: []
    required_tools:
      - name: project test commands
        required: true
    edits_allowed: true
    expected_output_fields:
      - failing_test
      - implementation_slice
      - artifact_version
      - review_risk_tags
      - green_validation
      - refactor_validation
      - final_entry_to_output_check
    stop_if:
      - failing_test_cannot_be_made_red
      - implementation_scope_expands_beyond_one_slice
      - required_validation_tooling_unavailable

subagent_contract_defaults:
  must_report:
    - skills_loaded
    - references_loaded
    - mcp_used
    - tools_used
    - skill_instructions_followed
    - deviations
  stop_if:
    - required_skill_unavailable
    - required_reference_unavailable
    - required_mcp_or_tool_unavailable
    - scope_unclear
    - ownership_conflict
    - validation_blocked
  memory_policy:
    persist_event: true
    candidate_short_term: true
    candidate_long_term: false
    event_log_fields:
      - timestamp
      - actor
      - task_id
      - event_type
      - summary
      - evidence_refs
      - artifact_refs
      - next_action
    event_types:
      - started
      - blocked
      - completed
      - decision
      - validation
      - handoff

parallelization:
  grilling: serial_only
  diagnosing-problem: read_only_parallel_allowed
  exploring-project: read_only_parallel_allowed
  reviewing-code: read_only_review_lanes_allowed
  adversarial-control: read_only_after_artifact_reaches_reviewable_state
  coding-project: write_parallel_only_with_non_overlapping_ownership
  coding-tdd: parallel_only_for_independent_functions_or_modules

reconciliation_checks:
  - required_skills_loaded
  - required_references_loaded
  - required_mcp_and_tools_used
  - skill_instructions_followed_reported
  - deviations_justified
  - expected_fields_present
  - ownership_respected
  - validation_evidence_present
  - implementation_review_risk_assessed
  - mandatory_review_created_for_high_risk_artifact
  - reviewer_actor_independent
  - reviewed_target_matches_current_artifact
  - blocking_findings_prevent_acceptance
  - blocking_findings_dispatch_fix
  - every_fix_followed_by_rereview
  - review_gate_cleared_for_latest_artifact
