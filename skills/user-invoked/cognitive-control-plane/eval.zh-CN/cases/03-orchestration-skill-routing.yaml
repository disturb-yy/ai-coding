- id: ACP-209
  title: 有症状但无原因
  category: skill-routing
  control: positive
  language: zh-CN
  prompt: 登录后 SAML 页面重复跳转，ticket 换 token 失败。我现在不知道问题在哪里，先分析怎么定位。
