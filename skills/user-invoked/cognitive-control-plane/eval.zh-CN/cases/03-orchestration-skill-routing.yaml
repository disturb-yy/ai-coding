- id: ACP-215
  title: 长任务需要持久状态
  category: orchestration
  control: positive
  language: zh-CN
  prompt: 这是一个跨多轮、多个 agent、多个阶段的高风险改造，需要中断后还能继续。
  expected:
    classification: Large
    orchestration: required
    persistent_state: true
    required_behaviors:
    - event_log_in_persistent_state
  auto_assertions:
  - path: trace.orchestration_used
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.persistent_state_used
    op: eq
    hard_fail: false
    value: true
    rubric: R-08
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - event_log_in_persistent_state
    rubric: R-08
