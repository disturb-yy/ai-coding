- id: ACP-213
  title: 委派契约完整性
  category: delegation
  control: positive
  language: zh-CN
  prompt: 将一个有边界的实现任务委派给 specialist，用于高风险仓库变更。
  expected:
    classification: Large
    orchestration: required
    task_contract_complete: true
  auto_assertions:
  - path: trace.task_contract_complete
    op: eq
    hard_fail: true
    value: true
