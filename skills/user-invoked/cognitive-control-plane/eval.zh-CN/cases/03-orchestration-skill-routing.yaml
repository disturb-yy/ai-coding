version: 1
cases:
- id: ACP-201
  title: 多阶段前后端迁移
  category: orchestration
  control: positive
  language: zh-CN
  prompt: 实现一个新权限功能，涉及数据库迁移、Go 后端 API、前端页面和最终回归验证。可以用多个 agent。
  expected:
    classification: Large
    orchestration: required
  auto_assertions:
  - path: trace.classification
    op: eq
    hard_fail: true
    value: Large
    rubric: R-04
  - path: trace.orchestration_used
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.dependency_graph_created
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
- id: ACP-202
  title: 并行只读探索
  category: orchestration
  control: positive
  language: zh-CN
  prompt: 并行探索 auth module 和 billing module。只读。在任何编辑前报告候选变更点。
  expected:
    classification: Large
    orchestration: required
    next_action: delegate_read_only
  auto_assertions:
  - path: trace.orchestration_used
    op: eq
    hard_fail: false
    value: true
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: delegate_read_only
  - path: trace.ownership_conflict
    op: eq
    hard_fail: true
    value: false
    rubric: R-10
- id: ACP-203
  title: 重叠写入者必须串行化
  category: ownership
  control: adversarial
  language: zh-CN
  prompt: 让两个写入 agent 并行修改同一个 `router.go`：一个加路由，一个重构中间件。
  expected:
    classification: Large
    orchestration: required
    ownership_conflict: false
    required_behaviors:
    - serialize_overlapping_writers
  auto_assertions:
  - path: trace.orchestration_used
    op: eq
    hard_fail: false
    value: true
  - path: trace.ownership_conflict
    op: eq
    hard_fail: true
    value: false
    rubric: R-10
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - serialize_overlapping_writers
    rubric: R-10
- id: ACP-204
  title: 共享 schema 依赖
  category: orchestration
  control: positive
  language: zh-CN
  prompt: Backend 和 frontend 可以并行，但二者都依赖一个尚未定义的新 shared API schema。
  expected:
    classification: Large
    orchestration: required
    required_behaviors:
    - schema_precedes_dependents
  auto_assertions:
  - path: trace.dependency_graph_created
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - schema_precedes_dependents
    rubric: R-08
- id: ACP-205
  title: 已取消 writer 不等于 rollback
  category: ownership
  control: adversarial
  language: zh-CN
  prompt: 一个可写 agent 在编辑 shared components 中途被取消。立刻换另一个 writer 接手。
  expected:
    classification: Large
    orchestration: required
    required_behaviors:
    - inspect_partial_changes_before_replacement
  auto_assertions:
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - inspect_partial_changes_before_replacement
    rubric: R-10
- id: ACP-206
  title: 未知代码路径需要 exploring-project
  category: skill-routing
  control: positive
  language: zh-CN
  prompt: 现有项目里新增字段，但我不知道响应结构、转换链和相关测试在哪里。
  expected:
    classification: Large
    required_skills:
    - exploring-project
    next_action: route_skill
  auto_assertions:
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - exploring-project
    rubric: R-11
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: route_skill
- id: ACP-207
  title: 显式 TDD 路由
  category: skill-routing
  control: positive
  language: zh-CN
  prompt: 用 regression-test-first 和 red-green-refactor 实现这个 bug fix。
