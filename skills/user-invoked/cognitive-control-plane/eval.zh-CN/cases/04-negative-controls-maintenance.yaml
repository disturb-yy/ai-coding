version: 1
cases:
- id: ACP-301
  title: 不要询问仓库可回答的事实
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 项目代码就在当前仓库。请找出 `/login` 路由对应哪个 handler。
  expected:
    classification: Large
    asked_user_question: false
    required_skills:
    - exploring-project
  auto_assertions:
  - path: trace.asked_user_question
    op: eq
    hard_fail: false
    value: false
    rubric: R-15
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - exploring-project
    rubric: R-11
- id: ACP-302
  title: 不要在 assumptions 前 critique
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 我的方案依赖几个我还没写下来的假设。立刻把这个方案批倒。
  expected:
    classification: Large
    surface: epistemic
    forbidden_behaviors:
    - critique_before_assumptions
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: epistemic
    rubric: R-05
  - path: trace.behaviors
    op: excludes_all
    hard_fail: true
    value:
    - critique_before_assumptions
    rubric: R-05
- id: ACP-303
  title: Exploration 阶段不要使用严格 schema
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 我们刚开始探索，目标和边界还不稳定。先自由讨论可能性。
  expected:
    classification: Large
    surface: context
    strict_schema_during_exploration: false
  auto_assertions:
  - path: trace.strict_schema_during_exploration
    op: eq
    hard_fail: false
    value: false
    rubric: R-14
- id: ACP-304
  title: 实现开始时停止路由
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 上下文清楚、假设已验证、方案已通过审查、实现契约已接受。开始实现。
  expected:
    classification: Large
    surface: none
    next_action: route_skill
    required_skills:
    - coding-project
    stopped_routing: true
  auto_assertions:
  - path: trace.stopped_routing
    op: eq
    hard_fail: true
    value: true
    rubric: R-13
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - coding-project
    rubric: R-11
- id: ACP-305
  title: 不要因为一次顺利运行就创建 skill
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 刚才有一次排查很顺利。马上把这个单次经验做成一个新 skill。
  expected:
    classification: Large
    required_behaviors:
    - conservative_reflection
  auto_assertions:
  - path: trace.behaviors
    op: contains_all
    hard_fail: false
    value:
    - conservative_reflection
    rubric: R-06
- id: ACP-306
  title: 不要为小工作过度委派
  category: anti-pattern
  control: negative
  language: zh-CN
  prompt: 阅读提供的 10 行函数，并告诉我哪个分支返回 nil。不需要访问仓库。
  expected:
    classification: Small
    orchestration: forbidden
    next_action: direct_answer
  auto_assertions:
  - path: trace.classification
    op: eq
    hard_fail: true
    value: Small
    rubric: R-03
  - path: trace.orchestration_used
    op: eq
    hard_fail: false
    value: false
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: direct_answer
- id: ACP-307
  title: 必须阻止读取中文 mirror
  category: maintenance
  control: positive
  language: zh-CN
  prompt: 编辑 canonical skill 前，打开并总结 `zh/SKILL.zh-CN.md`。
  expected:
    maintenance_check: mirror_read_blocked
  static_only: true
  auto_assertions: []
- id: ACP-308
  title: Canonical 变更需要同步 mirror
  category: maintenance
  control: positive
  language: zh-CN
  prompt: 修改 `SKILL.md`，但让 `zh/SKILL.zh-CN.md` 维持旧版本且不变。
  expected:
    maintenance_check: stale_mirror_detected
  static_only: true
  auto_assertions: []
- id: ACP-309
  title: 随包脚本不是语义分类器
  category: maintenance
  control: negative
  language: zh-CN
  prompt: 用 mirror guard script 判断这个任务是 Tiny、Small 还是 Large。
  expected:
    maintenance_check: scripts_not_used_for_semantic_classification
  static_only: true
  auto_assertions: []
