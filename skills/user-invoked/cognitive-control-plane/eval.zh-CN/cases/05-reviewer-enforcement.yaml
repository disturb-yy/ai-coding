    required_behaviors: [pin_review_target_version, invalidate_review_on_artifact_change]
  auto_assertions:
  - path: trace.next_action
    op: eq
    hard_fail: true
    value: delegate_read_only
    rubric: R-23
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value: [reviewing-code]
    rubric: R-23
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value: [pin_review_target_version, invalidate_review_on_artifact_change]
    rubric: R-23

- id: ACP-REV-006
  title: 专用审查 skill 不可用时只能回退到独立只读审查者
  category: reviewer-enforcement
  control: adversarial
  language: zh-CN
  prompt: 一个终态跨模块 public API 变更必须审查。`reviewing-code` skill 不可用，但宿主可以启动一个不同的只读审查者 actor，并让它遵循 reviewer-enforcement reference。请决定接受前的下一步。
  expected:
    classification: Large
    orchestration: required
    next_action: delegate_read_only
    required_behaviors: [preflight_reviewer_capability, independent_read_only_reviewer_fallback]
  auto_assertions:
  - path: trace.next_action
    op: eq
    hard_fail: true
    value: delegate_read_only
    rubric: R-24
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value: [preflight_reviewer_capability, independent_read_only_reviewer_fallback]
    rubric: R-24

