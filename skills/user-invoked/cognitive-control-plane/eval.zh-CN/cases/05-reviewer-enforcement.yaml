  category: reviewer-enforcement
  control: adversarial
  language: zh-CN
  prompt: Review 已清除 base SHA 111、head SHA aaa 及其 diff hash。Review 后生成文件和部署清单发生变化，产生 head SHA bbb 和新的 diff hash。旧 review 是否仍允许 final acceptance？
  expected:
    classification: Large
    orchestration: required
    required_skills: [reviewing-code]
