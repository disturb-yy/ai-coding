    classification: Large
    surface: epistemic
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: epistemic
    rubric: R-05
- id: ACP-106
  title: 具体方案需要攻击
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 方案已经定得比较具体：API Gateway 做鉴权，服务间全走 JWT，权限缓存 30 分钟。请做一次红队审查，重点找失败模式。
  expected:
    classification: Large
    surface: adversarial
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: adversarial
    rubric: R-05
  - path: trace.references_read
    op: contains_all
    hard_fail: false
    value:
    - references/adversarial-control.md
    rubric: R-07
- id: ACP-107
  title: 模糊想法要求 critique
  category: surface-order
  control: adversarial
  language: zh-CN
  prompt: 我有个想法：做一个全局 AI Agent 平台，但需求和边界还没想清楚。你先狠狠批评这个方案。
  expected:
    classification: Large
    surface: context
    forbidden_surface:
    - adversarial
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: context
    rubric: R-05
  - path: trace.active_surface
    op: not_in
    hard_fail: true
    value:
    - adversarial
    rubric: R-05
