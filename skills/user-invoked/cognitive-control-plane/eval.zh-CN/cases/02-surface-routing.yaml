version: 1
cases:
- id: ACP-101
  title: 缺少运行上下文
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 我们要把单体拆成微服务，你先告诉我怎么设计。
  expected:
    classification: Large
    surface: context
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: context
    rubric: R-05
  - path: trace.references_read
    op: contains_all
    hard_fail: false
    value:
    - references/context-control.md
    rubric: R-07
- id: ACP-102
  title: 长对话后的阶段切换
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 前面讨论很长了，现在进入实现阶段。请把当前目标、约束、关键决定、未决问题和下一步压缩成可继续执行的状态。
  expected:
    classification: Large
    surface: context
    next_action: deliver
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: false
    value: context
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: deliver
  - path: trace.stopped_routing
    op: eq
    hard_fail: true
    value: true
    rubric: R-13
- id: ACP-103
  title: 仓库可以回答缺失 scope
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 找出 request signing 在哪里实现，以及哪些测试覆盖它。仓库可用。
  expected:
    classification: Large
    surface: context
    next_action: route_skill
    required_skills:
    - exploring-project
    asked_user_question: false
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: false
    value: context
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - exploring-project
    rubric: R-11
  - path: trace.asked_user_question
    op: eq
    hard_fail: false
    value: false
    rubric: R-15
- id: ACP-104
  title: 薄弱因果断言
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 线上延迟肯定是数据库导致的，就按这个结论设计拆分方案。
  expected:
    classification: Large
    surface: epistemic
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: epistemic
    rubric: R-05
  - path: trace.references_read
    op: contains_all
    hard_fail: false
    value:
    - references/epistemic-control.md
    rubric: R-07
- id: ACP-105
  title: 关键架构假设
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 我们计划加入 Kafka，因为我们假设同步调用是可靠性问题的根因。我们还没有 incident evidence。
