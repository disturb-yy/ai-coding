  auto_assertions:
  - path: trace.next_action
    op: eq
    hard_fail: true
    value: delegate_read_only
    rubric: R-23
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - reviewing-code
    rubric: R-23
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - pin_review_target_version
    - invalidate_review_on_artifact_change
    rubric: R-23

- id: ACP-REV-006
  title: Dedicated reviewer skill unavailable uses only independent read-only fallback
  category: reviewer-enforcement
  control: adversarial
  language: en
  prompt: A terminal cross-module public API change requires mandatory review. The `reviewing-code` skill is unavailable, but this host can start a distinct read-only reviewer actor that can follow the reviewer-enforcement reference. Decide the next action before acceptance.
  expected:
    classification: Large
    orchestration: required
    next_action: delegate_read_only
    required_behaviors:
    - preflight_reviewer_capability
    - independent_read_only_reviewer_fallback
  auto_assertions:
  - path: trace.next_action
    op: eq
    hard_fail: true
    value: delegate_read_only
    rubric: R-24
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - preflight_reviewer_capability
    - independent_read_only_reviewer_fallback
    rubric: R-24

