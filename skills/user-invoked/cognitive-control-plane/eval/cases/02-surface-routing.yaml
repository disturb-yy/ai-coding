version: 1
cases:
- id: ACP-101
  title: Missing operating context
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 我们要把单体拆成微服务，你先告诉我怎么设计。
  expected:
    classification: Large
    surface: context
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: context
    rubric: R-05
  - path: trace.references_read
    op: contains_all
    hard_fail: false
    value:
    - references/context-control.md
    rubric: R-07
- id: ACP-102
  title: Phase transition after long conversation
  category: surface-routing
  control: positive
  language: zh-CN
  prompt: 前面讨论很长了，现在进入实现阶段。请把当前目标、约束、关键决定、未决问题和下一步压缩成可继续执行的状态。
  expected:
    classification: Large
    surface: context
    next_action: deliver
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: false
    value: context
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: deliver
  - path: trace.stopped_routing
    op: eq
    hard_fail: true
    value: true
    rubric: R-13
- id: ACP-103
  title: Repository can answer missing scope
  category: surface-routing
  control: positive
  language: en
  prompt: Find where request signing is implemented and which tests cover it. The
