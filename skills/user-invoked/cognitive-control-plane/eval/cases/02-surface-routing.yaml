    classification: Large
    surface: context
    forbidden_surface:
    - adversarial
  auto_assertions:
  - path: trace.active_surface
    op: eq
    hard_fail: true
    value: context
    rubric: R-05
  - path: trace.active_surface
    op: not_in
    hard_fail: true
    value:
    - adversarial
    rubric: R-05
- id: ACP-108
  title: Ready for machine handoff
  category: surface-routing
  control: positive
  language: en
  prompt: Discovery and design are complete. Produce the smallest machine-readable
