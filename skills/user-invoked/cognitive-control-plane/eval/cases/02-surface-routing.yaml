    op: eq
    hard_fail: false
    value: context
  - path: trace.required_skills
    op: contains_all
    hard_fail: true
    value:
    - exploring-project
    rubric: R-11
  - path: trace.asked_user_question
    op: eq
    hard_fail: false
    value: false
    rubric: R-15
