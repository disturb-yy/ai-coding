    op: eq
    hard_fail: true
    value: output
    rubric: R-05
  - path: trace.references_read
    op: contains_all
    hard_fail: false
    value:
    - references/output-control.md
    rubric: R-07
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: deliver
