- id: ACP-107
  title: Vague idea asks for critique
  category: surface-order
  control: adversarial
  language: zh-CN
  prompt: 我有个想法：做一个全局 AI Agent 平台，但需求和边界还没想清楚。你先狠狠批评这个方案。
