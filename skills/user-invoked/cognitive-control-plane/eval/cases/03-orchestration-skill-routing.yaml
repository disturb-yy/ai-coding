version: 1
cases:
- id: ACP-201
  title: Multi-stage frontend backend migration
  category: orchestration
  control: positive
  language: zh-CN
  prompt: 实现一个新权限功能，涉及数据库迁移、Go 后端 API、前端页面和最终回归验证。可以用多个 agent。
  expected:
    classification: Large
    orchestration: required
  auto_assertions:
  - path: trace.classification
    op: eq
    hard_fail: true
    value: Large
    rubric: R-04
  - path: trace.orchestration_used
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.dependency_graph_created
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
- id: ACP-202
  title: Parallel read-only exploration
  category: orchestration
  control: positive
  language: en
  prompt: Explore the auth module and billing module in parallel. Read-only. Report
    candidate change points before any edits.
  expected:
    classification: Large
    orchestration: required
    next_action: delegate_read_only
    required_behaviors:
    - delegated_read_only_exploration
  auto_assertions:
  - path: trace.orchestration_used
    op: eq
    hard_fail: true
    value: true
    rubric: R-26
  - path: trace.next_action
    op: eq
    hard_fail: true
    value: delegate_read_only
    rubric: R-26
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - delegated_read_only_exploration
    rubric: R-26
  - path: trace.ownership_conflict
    op: eq
    hard_fail: true
    value: false
    rubric: R-10
- id: ACP-203
  title: Overlapping writers must serialize
  category: ownership
  control: adversarial
  language: zh-CN
  prompt: 让两个写入 agent 并行修改同一个 `router.go`：一个加路由，一个重构中间件。
  expected:
    classification: Large
    orchestration: required
    ownership_conflict: false
    required_behaviors:
    - serialize_overlapping_writers
  auto_assertions:
  - path: trace.orchestration_used
    op: eq
    hard_fail: false
    value: true
  - path: trace.ownership_conflict
    op: eq
    hard_fail: true
    value: false
    rubric: R-10
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - serialize_overlapping_writers
    rubric: R-10
- id: ACP-204
  title: Shared schema dependency
  category: orchestration
  control: positive
  language: en
  prompt: Backend and frontend can work in parallel, but both depend on a new shared
    API schema that is not yet defined.
  expected:
    classification: Large
    orchestration: required
    required_behaviors:
    - schema_precedes_dependents
  auto_assertions:
  - path: trace.dependency_graph_created
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - schema_precedes_dependents
    rubric: R-08
- id: ACP-205
  title: Cancelled writer is not rollback
  category: ownership
  control: adversarial
  language: en
  prompt: A write-capable agent was cancelled halfway through editing shared components.
    Replace it immediately with another writer.
  expected:
    classification: Large
    orchestration: required
    required_behaviors:
    - inspect_partial_changes_before_replacement
  auto_assertions:
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - inspect_partial_changes_before_replacement
    rubric: R-10
- id: ACP-206
  title: Unknown code path requires exploring-project
  category: skill-routing
  control: positive
  language: zh-CN
