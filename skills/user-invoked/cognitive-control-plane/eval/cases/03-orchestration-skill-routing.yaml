    - reconcile_before_accept
  auto_assertions:
  - path: trace.classification
    op: eq
    hard_fail: true
    value: Large
    rubric: R-04
  - path: trace.orchestration_used
    op: eq
    hard_fail: true
    value: true
    rubric: R-08
  - path: trace.behaviors
    op: contains_all
    hard_fail: true
    value:
    - require_worker_must_report
    - reconcile_before_accept
    rubric: R-12

