version: 1
cases:
- id: ACP-001
  title: Simple term explanation
  category: activation
  control: negative
  language: zh-CN
  prompt: 只解释一下 Go 日志里的 EOF 是什么意思，不需要排查代码。
  expected:
    activation: forbidden
    classification: Tiny
    surface: none
    orchestration: forbidden
    next_action: direct_answer
  auto_assertions:
  - path: trace.activated
    op: eq
    hard_fail: false
    value: false
    rubric: R-01
  - path: trace.classification
    op: eq
    hard_fail: false
    value: Tiny
    rubric: R-02
  - path: trace.active_surface
    op: eq
    hard_fail: false
    value: none
  - path: trace.next_action
    op: eq
    hard_fail: false
    value: direct_answer
  - path: trace.orchestration_used
    op: eq
    hard_fail: false
    value: false
